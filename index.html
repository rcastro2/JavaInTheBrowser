<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java App Launcher (.class)</title>
    <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            margin: 0;
        }
        .container{
            display:flex;
        }

        .controls {
            margin-bottom: 20px;
        }

        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #444;
            cursor: pointer;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #app-container,#code{
            flex:1;
        }
        #app-wrapper {
            position: relative;
            width: 500px;
            height: 400px;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        #display-area {
            width: 100%;
            height: 100%;
        }
        #terminal {
            background-color: #000000;
            color: #00ff00; /* Classic green terminal text */
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            width: 500px;
            height: 400px;
            box-sizing: border-box;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        #code-block{
            
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="appSelect">Select Application: </label>
        <!-- Dropdown values match the main Java class names -->
        <select id="appSelect" onchange="switchApp(this.value)">
            <option value="BouncingBall">Bouncing Ball Game</option>
            <option value="HelloWorldSwing">Hello World (Swing)</option>
            <option value="HelloWorldConsole">Hello World (Console)</option>
            <option value="FibonacciConsole">Fibonacci (Console)</option>
        </select>
    </div>
    <div class="container">
        <div id="app-container">
            <div id="app-wrapper">
                <div id="loading">Initializing CheerpJ JVM...</div>
                <div id="display-area"></div>
            </div>
            <!-- Replace or place alongside your canvas wrapper -->
            <pre id="terminal"></pre>
        </div>
        <div>
            <pre><code id="code-block" >Loading source code...</code></pre>
        </div>
    </div>
    <script>
        let isJvmReady = false;

        // Base classpath directory handler (supports Localhost & GitHub Pages)
        function getClasspath() {
            return `/app${getFetchPath()}`;
        }
        function getFetchPath() {
            let path = window.location.pathname.replace(/index\.html$/, '');
            if (!path.endsWith('/')) path += '/';
            return path;
        }
        // Fetch and render .java source file text
        async function loadSourceCode(className) {
            const codeBlock = document.getElementById("code-block");
            codeBlock.textContent = "Loading source code...";

            try {
                const response = await fetch(`${getFetchPath()}${className}.java`);
                if (!response.ok) throw new Error("File not found");
                
                const sourceText = await response.text();
                codeBlock.textContent = sourceText;
            } catch (err) {
                codeBlock.textContent = `// Unable to load ${className}.java\n// Ensure the .java file is committed to your repository.`;
            }
        }
        // Initialize CheerpJ runtime once
        async function initJvm() {
            const terminal = document.getElementById("terminal");
            const originalLog = console.log;

            // Intercept all console output (including System.out.println)
            console.log = function (...args) {
                originalLog.apply(console, args); // Keeps logging to DevTools console
                
                // Append printed text to the HTML terminal element
                const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(" ");
                if(!message.includes("CheerpJ")){
                    terminal.textContent += message ;
                }
                
                // Auto-scroll to the bottom as new lines arrive
                terminal.scrollTop = terminal.scrollHeight;
            };
            await cheerpjInit({ status: "none" });
            isJvmReady = true;

            // Load initial selected option
            const selector = document.getElementById("appSelect");
            switchApp(selector.value);
        }

        async function switchApp(className) {
            if (!isJvmReady) return;


            const selector = document.getElementById("appSelect");
            const loading = document.getElementById("loading");
            const displayArea = document.getElementById("display-area");
            const displayWrapper = document.getElementById("app-wrapper");
            const consoleApp = className.includes("Console");
            
            terminal.style.display = consoleApp ? "block":"none";
            displayWrapper.style.display = consoleApp ? "none":"block";
            displayArea.style.opacity = "0";

            // Prevent rapid selection switching during load
            selector.disabled = true;

            // Show loading screen
            loading.style.display = "flex";
            loading.style.opacity = "1";

            // 1. Fetch source code in parallel
            loadSourceCode(className);

            // 1. Clear previous Java display container
            displayArea.innerHTML = "";

            // 2. Create fresh DOM element for new canvas
            const container = document.createElement("div");
            container.style.width = "500px";
            container.style.height = "400px";
            displayArea.appendChild(container);

            // 3. Attach CheerpJ display
            cheerpjCreateDisplay(500, 400, container);

            // 4. Execute class via cheerpjRunMain
            // Arg 1: Main Class Name
            // Arg 2: Virtual Classpath Directory (/app/your-repo/)
            const appPromise = cheerpjRunMain(className, getClasspath());

            // 5. Rendering buffer delay
            await new Promise(r => setTimeout(r, 1200));

            // Hide loader and unlock dropdown
            loading.style.opacity = "0";
            setTimeout(() => { loading.style.display = "none";displayArea.style.opacity = "1"; }, 1000);
            selector.disabled = false;

            await appPromise;
        }

        // Start initialization on page load
        initJvm();
    </script>
</body>
</html>
