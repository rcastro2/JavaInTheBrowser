<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CheerpJ Swing Demo</title>
    <!-- Load CheerpJ 3.0 runtime loader -->
    <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
    <style>
        /* Loading indicator styling */
        #loading {
            font-family: sans-serif;
            font-size: 18px;
            color: #555;
            padding: 20px;
        }

        /* Container is hidden by default */
        #container {
            display: none; 
            width: 500px; 
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Java Swing Application</h1>
    <!-- Shown while Java & WebAssembly compile/load -->
    <div id="loading">Loading Java Runtime...</div>

    <!-- Display container for Swing UI -->
    <div id="container" style="width: 500px; height: 300px; border: 1px solid #ccc;"></div>

    <script>
        async function loadApp() {
            const container = document.getElementById("container");
            const loading = document.getElementById("loading");

            // 1. Initialize the CheerpJ runtime
            await cheerpjInit();
            // Extract repository path from the current URL
            let path = window.location.pathname.replace(/index\.html$/, '');
            if (!path.endsWith('/')) path += '/';

            // 2. Attach CheerpJ display to the HTML div element
            cheerpjCreateDisplay(500, 400, container);

            // -------------------------------------------------------------
            // OPTION A: Run directly from a compiled .class file
            // -------------------------------------------------------------
            // Arguments: Fully qualified class name, Virtual Classpath
            // "/app/" points to the root directory where index.html is hosted.
            //await cheerpjRunMain("BouncingBall", "/app/");
            // cheerpjRunMain arguments:
            // 1. Fully qualified Main Class name ("BouncingBall")
            // 2. Virtual Classpath directory ("/app/repo-name/")
            //await cheerpjRunMain("BouncingBall", `/app${path}`);
            // 4. Start the Java application
            const appPromise = cheerpjRunMain("BouncingBall", `/app${path}`);

            // 5. Hide the loading message and reveal the Java container
            loading.style.display = "none";
            container.style.display = "block";

            // 6. Keep app running
            await appPromise;

            // -------------------------------------------------------------
            // OPTION B: Run from an executable .jar file
            // -------------------------------------------------------------
            // Uncomment the line below to run via app.jar instead of Option A



            // Resolves to /app/app.jar on localhost 
            // Resolves to /app/your-repo-name/app.jar on GitHub Pages
            //await cheerpjRunJar(`/app/app.jar`);
            //await cheerpjRunJar(`/app${path}app.jar`);
        }

        loadApp();
    </script>
</body>
</html>
